<!DOCTYPE html>

<style>
/* ============================================================
   RESET + VARIABLES (misma paleta que index.html)
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-dark: #0a0a0a;
  --text-light: #e8e6e1;
  --text-light-muted: rgba(232, 230, 225, 0.75);
  --accent-earth: #8b6f47;
  --accent-gold: #c9b896;
  --font-serif: 'Fraunces', Georgia, serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
body {
  font-family: var(--font-sans); font-weight: 300; line-height: 1.6;
  background: var(--bg-dark); color: var(--text-light);
  min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
  padding: 80px 56px;
}
a { color: inherit; text-decoration: none; }
.logo { position: absolute; top: 24px; left: 56px; }
.logo svg { height: 32px; width: auto; display: block; color: var(--text-light); }
.eyebrow {
  font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--accent-gold); margin-bottom: 32px;
}
h1 {
  font-family: var(--font-serif); font-weight: 300;
  font-size: clamp(44px, 8vw, 96px); line-height: 1; letter-spacing: -0.03em;
  margin-bottom: 32px;
}
h1 em { font-style: italic; color: var(--accent-gold); }
p { font-size: 17px; color: var(--text-light-muted); max-width: 560px; margin-bottom: 48px; }
.actions { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
.btn-primary {
  padding: 18px 36px; font-size: 14px; font-weight: 500; letter-spacing: 0.05em;
  background: var(--text-light); color: var(--bg-dark); border: 0.5px solid var(--text-light);
  transition: background 0.3s ease;
}
.btn-primary:hover { background: var(--accent-gold); border-color: var(--accent-gold); }
.btn-link { font-size: 14px; border-bottom: 0.5px solid rgba(232, 230, 225, 0.3); padding: 6px 0; }
.btn-link:hover { color: var(--accent-gold); border-color: var(--accent-gold); }

@media (max-width: 640px) {
  body { padding: 100px 20px 60px; }
  .logo { left: 20px; }
  .actions { flex-direction: column; align-items: stretch; text-align: center; }
}
</style>
</head>
<body>

<a href="/" class="logo" aria-label="Build &amp; Create Studio — Inicio">
  <svg viewBox="0 0 800 270" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="butt" stroke-linejoin="round">
      <path d="M 17,25 L 320,25 Q 378,25 378,80 Q 378,135 320,135 L 17,135 L 320,135 Q 378,135 378,190 Q 378,245 320,245 L 17,245" />
      <path d="M 784,25 L 475,25 Q 417,25 417,80 L 417,190 Q 417,245 475,245 L 784,245" />
    </g>
    <circle cx="78" cy="80" r="15" fill="currentColor" />
    <circle cx="78" cy="190" r="15" fill="currentColor" />
  </svg>
</a>

<main>
  <div class="eyebrow">Error 404</div>
  <h1>Esta página<br>no <em>existe.</em></h1>
  <p>Es posible que la dirección haya cambiado o que el enlace esté incompleto. Desde el inicio puedes ver nuestros proyectos y servicios.</p>
  <div class="actions">
    <a href="/" class="btn-primary">Volver al inicio →</a>
    <a href="/diseno-estrategico.html" class="btn-link">Ver diseño estratégico y proyectos</a>
    <a href="/#contacto" class="btn-link">Contacto</a>
  </div>
</main>
